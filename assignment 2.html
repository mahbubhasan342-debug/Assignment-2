<!DOCTYPE html>
<html>
<head>
  <title>Student Record Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    input, button { margin: 5px; padding: 8px; }
  </style>
</head>
<body>
  <h2>Student Record Management</h2>

  <div>
    <input type="text" id="id" placeholder="ID">
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="department" placeholder="Department">
    <input type="number" step="0.01" id="cgpa" placeholder="CGPA">
    <button onclick="addStudent()">Add Student</button>
  </div>

  <div>
    <input type="text" id="searchId" placeholder="Search by ID">
    <button onclick="searchStudent()">Search</button>
    <button onclick="updateCGPA()">Update CGPA</button>
    <button onclick="deleteStudent()">Delete Student</button>
  </div>

  <table id="studentTable">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Department</th>
      <th>CGPA</th>
    </tr>
  </table>

  <script>
    let students = [
      {id: "101", name: "Altaf", department: "CSE", cgpa: "3.45"},
      {id: "102", name: "Mishu", department: "EEE", cgpa: "3.80"},
      {id: "103", name: "Trishna", department: "BBA", cgpa: "3.60"},
      {id: "104", name: "Apurba", department: "English", cgpa: "3.25"}
    ];

    function addStudent() {
      let id = document.getElementById("id").value;
      let name = document.getElementById("name").value;
      let department = document.getElementById("department").value;
      let cgpa = document.getElementById("cgpa").value;

      if(id && name && department && cgpa) {
        students.push({id, name, department, cgpa});
        displayStudents();
        clearInputs();
      } else {
        alert("Please fill all fields!");
      }
    }

    function displayStudents() {
      let table = document.getElementById("studentTable");
      table.innerHTML = `
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Department</th>
          <th>CGPA</th>
        </tr>`;
      students.forEach(s => {
        table.innerHTML += `
          <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.department}</td>
            <td>${s.cgpa}</td>
          </tr>`;
      });
    }

    function searchStudent() {
      let searchId = document.getElementById("searchId").value;
      let student = students.find(s => s.id === searchId);
      if(student) {
        alert(`Found: ${student.name}, Dept: ${student.department}, CGPA: ${student.cgpa}`);
      } else {
        alert("Student not found!");
      }
    }

    function updateCGPA() {
      let searchId = document.getElementById("searchId").value;
      let newCgpa = prompt("Enter new CGPA:");
      let student = students.find(s => s.id === searchId);
      if(student && newCgpa) {
        student.cgpa = newCgpa;
        displayStudents();
        alert("CGPA updated!");
      } else {
        alert("Student not found or invalid CGPA!");
      }
    }

    function deleteStudent() {
      let searchId = document.getElementById("searchId").value;
      students = students.filter(s => s.id !== searchId);
      displayStudents();
      alert("Student deleted if existed!");
    }

    function clearInputs() {
      document.getElementById("id").value = "";
      document.getElementById("name").value = "";
      document.getElementById("department").value = "";
      document.getElementById("cgpa").value = "";
    }

    // Display initial records
    displayStudents();
  </script>
</body>
</html>
